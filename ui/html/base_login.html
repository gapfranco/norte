{{define "base"}}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Norte - Login</title>
    <meta name="color-scheme" content="light only">
    {{template "pwa" .}}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <meta name="csrf-token" content="{{.CSRFToken}}">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif">

<div class="flex min-h-dvh flex-col lg:flex-row">
    <div class="relative min-h-44 overflow-hidden text-white lg:hidden sm:min-h-52" style="padding-top: env(safe-area-inset-top, 0px)">
        <div class="absolute inset-0 bg-gradient-to-br from-navy-600 to-navy-900"></div>
        <img src="/static/login-bg.jpg" alt="" class="absolute inset-0 h-full w-full object-cover opacity-35">
        <div class="relative flex min-h-44 items-center justify-center px-6 py-10 sm:min-h-52">
            <div class="mx-auto flex max-w-sm flex-col items-center text-center">
                <img src="/static/icons/norte-icon.svg" alt="" width="48" height="48" class="h-12 w-12 rounded-xl shadow-md">
                <p class="mt-3 text-2xl font-bold tracking-tight">Norte</p>
                <p class="mt-2 text-sm font-semibold text-navy-100">Direcionando seus negócios com segurança</p>
            </div>
        </div>
    </div>

    <div class="flex flex-1 flex-col justify-center px-4 py-8 md:px-16 safe-main">
        {{template "main" .}}
    </div>

    <div class="relative hidden w-2/5 flex-shrink-0 lg:block">
        <div class="absolute inset-0 bg-gradient-to-br from-navy-600 to-navy-900"></div>
        <img src="/static/login-bg.jpg" alt="" class="absolute inset-0 h-full w-full object-cover opacity-30">
        <div class="relative flex h-full items-center justify-center p-10 text-center text-white">
            <div class="flex flex-col items-center">
                <img src="/static/icons/norte-icon.svg" alt="" width="64" height="64" class="h-16 w-16 rounded-2xl shadow-lg">
                <p class="mt-4 text-3xl font-bold tracking-tight">Norte</p>
                <p class="mt-3 text-base font-semibold text-navy-100">Direcionando seus negócios com segurança</p>
            </div>
        </div>
    </div>
</div>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', {scope: '/'}).catch(function() {});
    });
}
</script>
</body>
</html>
{{end}}
