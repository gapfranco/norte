{{define "main"}}
<div class="page-form">
    <div class="flex items-center gap-3 mb-6">
        <h2 class="text-xl font-semibold text-slate-900">Alterar senha</h2>
    </div>

    <div class="form-card">
        {{if .Flash}}
        <div class="flash-banner flash-success mb-4" role="status">{{.Flash}}</div>
        {{end}}

        <form action="/config/senha" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

            <div>
                <label for="senha_atual" class="block text-sm font-medium text-slate-800 mb-1">Senha atual</label>
                <input type="password" id="senha_atual" name="senha_atual" required autocomplete="current-password"
                    class="form-control">
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-slate-800 mb-1">Nova senha</label>
                <input type="password" id="senha" name="senha" required minlength="6" autocomplete="new-password"
                    class="form-control">
            </div>

            <div>
                <label for="senha_confirmacao" class="block text-sm font-medium text-slate-800 mb-1">Confirmar nova senha</label>
                <input type="password" id="senha_confirmacao" name="senha_confirmacao" required minlength="6"
                    autocomplete="new-password" class="form-control">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    Salvar
                </button>
                <a href="/config/usuarios" class="btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{{end}}
